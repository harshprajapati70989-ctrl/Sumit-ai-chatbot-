<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sumit Prajapati AI</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f2f2f2;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .chat {
      height: calc(100vh - 130px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 15px;
      line-height: 1.5;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .ai {
      background: white;
      color: #111;
      margin-right: auto;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 16px;
    }

    button {
      margin-left: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="header">
    🤖 Sumit Prajapati AI
  </div>

  <div class="chat" id="chat">
    <div class="message ai">
      नमस्ते! मैं Sumit Prajapati AI हूँ। आप मुझसे कुछ भी पूछ सकते हैं।
    </div>
  </div>

  <div class="bottom">
    <input
      type="text"
      id="userInput"
      placeholder="अपना सवाल लिखें..."
      onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">Send</button>
  </div>

<script>

  // अपनी Groq API Key यहां डालें
  const GROQ_API_KEY = "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";

  async function sendMessage() {

    const input = document.getElementById("userInput");
    const chat = document.getElementById("chat");

    const question = input.value.trim();

    if (!question) return;

    // User message
    chat.innerHTML += `
      <div class="message user">
        ${question}
      </div>
    `;

    input.value = "";

    // Loading message
    const loading = document.createElement("div");
    loading.className = "message ai";
    loading.innerText = "सोच रहा हूँ...";
    chat.appendChild(loading);

    chat.scrollTop = chat.scrollHeight;

    try {

      const response = await fetch(
        "https://api.groq.com/openai/v1/chat/completions",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + GROQ_API_KEY
          },

          body: JSON.stringify({

            model: "llama-3.3-70b-versatile",

            messages: [
              {
                role: "system",
                content:
                  "आप Sumit Prajapati AI हैं। हमेशा सरल और उपयोगी हिंदी में जवाब दें।"
              },

              {
                role: "user",
                content: question
              }
            ]

          })
        }
      );

      const data = await response.json();

      loading.remove();

      if (data.choices && data.choices.length > 0) {

        const answer = data.choices[0].message.content;

        chat.innerHTML += `
          <div class="message ai">
            ${answer}
          </div>
        `;

      } else {

        chat.innerHTML += `
          <div class="message ai">
            ❌ AI से जवाब नहीं मिला।
          </div>
        `;

      }

    } catch (error) {

      loading.remove();

      chat.innerHTML += `
        <div class="message ai">
          ❌ API से कनेक्शन नहीं हो पाया।
        </div>
      `;

      console.error(error);
    }

    chat.scrollTop = chat.scrollHeight;
  }

</script>

</body>
</html>
